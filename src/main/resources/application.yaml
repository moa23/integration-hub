spring:
  application:
    name: integration-hub

  datasource:
    url: ${DB_URL:jdbc:postgresql:///integrationhub?cloudSqlInstance=springboot-integration-hub:europe-north1:integration-hub-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory}
    username: ${DB_USERNAME:integrationuser}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${PORT:8080}