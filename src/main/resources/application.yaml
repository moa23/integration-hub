spring:
  application:
    name: integration-hub

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/integrationhub
    username: integrationuser
    password: integrationpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

